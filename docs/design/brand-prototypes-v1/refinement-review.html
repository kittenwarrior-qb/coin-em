<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EmCoin — đối chiếu prototype</title>
<style>body{margin:0;padding:24px;background:#f6f3ec;color:#153d57;font:16px/1.5 system-ui}h1{font-size:26px}p{max-width:850px}select{font:inherit;padding:10px;border:1px solid #aab4c2;border-radius:8px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px;margin-top:24px}figure{margin:0}figcaption{font-weight:700;margin-bottom:8px}img{width:100%;max-width:430px;border-radius:12px;border:1px solid #ddd}a{color:#245777}</style>
<h1>Đối chiếu prototype — Menu và gameplay</h1>
<p>Vòng sửa này tách nền gameplay khỏi Home, đồng bộ icon và nhãn người chơi, thu gọn chọn người nhận Coin. Màn thật dùng avatar, vai trò và số Coin đúng luật; không sao chép các số/nhân vật giả trong prototype. Chưa chứng nhận giống từng pixel.</p>
<label>Theme <select id="theme"><option value="kindness-workshop">Xưởng Tử Tế</option><option value="emotion-orbit">Vòng Cảm Xúc</option></select></label>
<main id="grid"></main><script>
function render(){const t=document.querySelector('#theme').value,p=t==='kindness-workshop'?'c':'b';const entries=[['Prototype Menu',p+'-menu.png'],['Menu thật','refinement-live/'+t+'-menu.png'],['Prototype bàn và Trao Coin',p+'-board.png'],['Bàn thật · 6 người','refinement-live/'+t+'-board-6.png'],['Bàn thật · 10 người','refinement-live/'+t+'-board-10.png'],['Bàn 10 người · đã cuộn tới người cuối','refinement-live/'+t+'-board-10-bottom.png'],['Trao Coin · đã chọn người nhận','refinement-live/'+t+'-give-picker.png']];document.querySelector('#grid').replaceChildren(...entries.map(([label,src])=>{const f=document.createElement('figure'),c=document.createElement('figcaption'),i=document.createElement('img');c.textContent=label;i.src=src;i.alt=label;i.loading='lazy';f.append(c,i);return f}))}const selected=new URLSearchParams(location.search).get('theme');if(['emotion-orbit','kindness-workshop'].includes(selected))document.querySelector('#theme').value=selected;document.querySelector('#theme').addEventListener('change',render);render();</script></html>
