name: emcoin
services:
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes", --appendfsync, always]
    restart: unless-stopped
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: &logging
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  backend:
    image: ${EMCOIN_BACKEND_IMAGE:?Set the verified release image}
    environment:
      NODE_ENV: production
      PORT: "3001"
      CLIENT_ORIGIN: https://${EMCOIN_DOMAIN:?Set the approved domain}
      DEBUG_ROLE_PICKER: "false"
      ROOM_STORAGE_MODE: redis-required
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      EMCOIN_CATALOG_DB: /app/data/catalog.sqlite
      EMCOIN_ADMIN_ORIGIN: https://${EMCOIN_DOMAIN:?Set the approved domain}
      EMCOIN_ADMIN_PASSWORD_HASH: ${EMCOIN_ADMIN_PASSWORD_HASH:?Provision a separate EmCoin admin password hash}
    volumes: [backend-data:/app/data]
    depends_on:
      redis: {condition: service_healthy}
    restart: unless-stopped
    logging: *logging
  web:
    image: ${EMCOIN_WEB_IMAGE:?Set the verified release image}
    environment:
      EMCOIN_DOMAIN: ${EMCOIN_DOMAIN:?Set the approved domain}
      ACME_EMAIL: emcoincloud@gmail.com
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      backend: {condition: service_healthy}
    restart: unless-stopped
    logging: *logging
volumes:
  redis-data:
  backend-data:
  caddy-data:
  caddy-config:
