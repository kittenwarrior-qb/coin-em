name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: be/package-lock.json

      - name: Install backend deps
        run: npm ci
        working-directory: be

      - name: Backend lint
        run: npm run lint
        working-directory: be

      - name: Backend build check
        run: npm run build
        working-directory: be

      - name: Backend tests
        run: npm test
        working-directory: be

      - name: Install frontend deps
        run: npm ci
        working-directory: fe

      - name: Frontend lint
        run: npm run lint
        working-directory: fe

      - name: Verify unchanged asset manifest
        run: node scripts/verify-asset-manifest.mjs
        working-directory: fe

      - name: Frontend tests
        run: npm test --if-present
        working-directory: fe

      - name: Frontend build check
        run: npm run build
        working-directory: fe

  e2e:
    name: Isolated Browser QA (mock Redis)
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: |
            be/package-lock.json
            fe/package-lock.json
            e2e/package-lock.json

      - name: Install all deps
        run: |
          cd be && npm ci
          cd ../fe && npm ci
          cd ../e2e && npm ci

      - name: Install Playwright
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
        working-directory: e2e

      - name: Build isolated production preview for admin QA
        run: npm run build
        working-directory: fe
        env:
          VITE_API_URL: http://127.0.0.1:3001
          VITE_DEBUG_ROLE_PICKER: 'false'

      - name: Run owned room, public-guide PWA and showcase scenarios
        working-directory: be
        env:
          TMPDIR: ${{ runner.temp }}
        run: node node_modules/vitest/vitest.mjs run --config vitest.browser.config.ts --exclude tests/browser/terminal.browser.ts

      - name: Upload synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-browser-qa
          path: |
            ${{ runner.temp }}/emcoin-room-browser-qa-*/
            ${{ runner.temp }}/emcoin-pwa-browser-qa-*/
            ${{ runner.temp }}/emcoin-showcase-browser-qa-*/
            ${{ runner.temp }}/emcoin-admin-browser-qa-*/
            ${{ runner.temp }}/emcoin-public-info-browser-qa-*/
          if-no-files-found: warn
          retention-days: 3

  terminal:
    name: Isolated full-game terminal QA (mock Redis)
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: |
            be/package-lock.json
            fe/package-lock.json
            e2e/package-lock.json
      - name: Install owned terminal fixture dependencies
        run: |
          cd be && npm ci
          cd ../fe && npm ci
          cd ../e2e && npm ci
      - name: Install Chromium
        working-directory: e2e
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Run full-game UI fixtures on owned loopback/mock Redis
        working-directory: be
        env:
          TMPDIR: ${{ runner.temp }}
        run: node node_modules/vitest/vitest.mjs run --config vitest.browser.config.ts tests/browser/terminal.browser.ts
      - name: Upload synthetic terminal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-terminal-qa
          path: ${{ runner.temp }}/emcoin-terminal-browser-qa-*/
          if-no-files-found: warn
          retention-days: 3
